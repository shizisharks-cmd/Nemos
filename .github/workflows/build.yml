name: Build NEMOS APP APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile & Sign NEMOS_APP.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache persistent keystore
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: nemos-keystore-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/debug.keystore || true
            git commit -m "Persist keystore [skip ci]" || true
            git push origin || true
          fi
          cp app/debug.keystore ~/.android/debug.keystore

      - name: Auto-increment versionCode
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts 2>/dev/null || true
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle.kts 2>/dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug-Signed APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare NEMOS_APP.apk artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NEMOS_APP.apk
          ls -lh dist/NEMOS_APP.apk

      - name: Upload NEMOS_APP.apk to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEMOS_APP
          path: dist/NEMOS_APP.apk
          if-no-files-found: error
          retention-days: 30

      - name: Send NEMOS_APP.apk to Telegram
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          TOKEN="${TG_BOT_TOKEN}"
          CHAT_ID="${TG_CHAT_ID}"
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            curl -sS -F "chat_id=${CHAT_ID}" \
              -F "document=@dist/NEMOS_APP.apk" \
              -F "caption=🚀 Обновление NEMOS APP готово! Подпись навсегда зафиксирована в облаке." \
              "https://api.telegram.org/bot${TOKEN}/sendDocument"
          fi
