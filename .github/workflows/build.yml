name: Build NEMOS APP APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Sign NEMOS_APP.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug-Signed APK (assembleDebug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare NEMOS_APP.apk artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NEMOS_APP.apk
          ls -lh dist/NEMOS_APP.apk

      - name: Upload NEMOS_APP.apk to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEMOS_APP
          path: dist/NEMOS_APP.apk
          if-no-files-found: error
          retention-days: 30
